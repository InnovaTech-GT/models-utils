[metadata]
name = database-utils
version = 2.2.0
author = Ricardo Pellecer
author_email = you@example.com
description = Shared SQLAlchemy models, migrations, and dependencies for FastAPI services with comprehensive audit logging (UUID primary keys)
long_description = file: README.md
long_description_content_type = text/markdown
url = https://github.com/InnovaTech-GT/models-utils
license = MIT

[options]
packages = find:
python_requires = >=3.11
install_requires =
    # Upper bound is load-bearing, not caution: SQLAlchemy 2.1 changed the
    # default DBAPI for a bare `postgresql://` URL from psycopg2 to psycopg
    # (v3), which we do not ship -- every consumer builds its engine from
    # POSTGRES_* env vars into that bare scheme, so a fresh install on 2.1
    # fails at engine creation. That breaks models-utils CI, and every Railway
    # deploy of backend-erp / auth-erp / provision-worker, since they pin
    # neither SQLAlchemy nor psycopg and inherit both transitively from here.
    # To lift the bound: switch every URL to `postgresql+psycopg2://`, or add
    # psycopg[binary] and migrate deliberately.
    sqlalchemy>=2.0,<2.1
    alembic>=1.12
    bcrypt>=4.2.0
    psycopg2-binary
    pydantic>=2.12.5
    python-dotenv>=1.0
    fastapi>=0.100.0
    PyJWT>=2.8.0
    loguru>=0.7.3
    email-validator>=2.0.0
    opentelemetry-api>=1.20.0
    Jinja2>=3.1
    aiosmtplib>=3.0
    cryptography>=42
include_package_data = True

[options.packages.find]
include = database_utils*

[options.package_data]
database_utils = templates/email/*.html