[metadata]
name = database-utils
version = 1.23.2
author = Ricardo Pellecer
author_email = you@example.com
description = Shared SQLAlchemy models, migrations, and dependencies for FastAPI services with comprehensive audit logging (UUID primary keys)
long_description = file: README.md
long_description_content_type = text/markdown
url = https://github.com/InnovaTech-GT/models-utils
license = MIT

[options]
packages = find:
python_requires = >=3.11
install_requires =
    sqlalchemy>=2.0
    alembic>=1.12
    bcrypt>=4.2.0
    psycopg2-binary
    pydantic>=2.12.5
    python-dotenv>=1.0
    fastapi>=0.100.0
    PyJWT>=2.8.0
    loguru>=0.7.3
    email-validator>=2.0.0
    opentelemetry-api>=1.20.0
    Jinja2>=3.1
    aiosmtplib>=3.0
    cryptography>=42
include_package_data = True

[options.packages.find]
include = database_utils*

[options.package_data]
database_utils = templates/email/*.html