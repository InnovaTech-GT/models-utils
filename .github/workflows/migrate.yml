name: Alembic Migrate

# Railway hosts two long-lived environments and each has its own Postgres:
#   push to `develop` -> development DB (Railway `development` environment)
#   push to `main`    -> production DB  (Railway `production` environment)
# Same job either way; the GitHub environment picks the `DB_URL` secret. The
# local docker compose DB is still migrated by the compose `migrate` service.

on:
  push:
    branches:
      - develop
      - main
    paths:
      # Widened from alembic/versions/** (doc 16 §2.0): env.py and seed changes
      # must also trigger the migration job. Rule: every seed change ships
      # with a (possibly no-op) revision.
      - "alembic/**"
  # Manual re-run (e.g. a secret rotation or a failed run) for either DB.
  workflow_dispatch:

jobs:
  migrate:
    name: Migrate ${{ github.ref_name == 'main' && 'production' || 'development' }} database
    if: github.ref_name == 'main' || github.ref_name == 'develop'
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'production' || 'development' }}
    # Never run two upgrades against the same DB at once.
    concurrency:
      group: migrate-${{ github.ref_name }}
      cancel-in-progress: false
    env:
      DB_URL: ${{ secrets.DB_URL }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .

      - name: Apply migrations
        run: alembic upgrade head
