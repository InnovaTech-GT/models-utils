name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require a migration for model changes
        if: github.event_name == 'pull_request'
        run: |
          BASE="origin/${{ github.base_ref }}"
          CHANGED=$(git diff --name-only "$BASE"...HEAD)
          MODELS=$(echo "$CHANGED" | grep -cE '^database_utils/models/.*\.py$' || true)
          MIGR=$(echo "$CHANGED" | grep -cE '^alembic/versions/.*\.py$' || true)
          if [ "$MODELS" -gt 0 ] && [ "$MIGR" -eq 0 ]; then
            echo "::error::Model files changed but no alembic/versions migration was added. The prod DB migrate workflow is path-filtered to alembic/versions/**, so prod would NOT migrate."
            exit 1
          fi
          echo "migration guard OK (models=$MODELS, migrations=$MIGR)"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install . -r requirements-dev.txt
      - name: Lint (advisory)
        run: ruff check .
        continue-on-error: true
      - name: Tests
        env:
          # database_utils.database builds the engine from these at import
          # (lazy connect); tests use an in-memory SQLite session, so these
          # are placeholders just to satisfy the import-time config check.
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_HOST: localhost
          POSTGRES_PORT: "5432"
          POSTGRES_DB: test
        run: pytest -v

  # Postgres-only guarantees (doc 40 §4.2 C1): deferred triggers, composite
  # FKs, NO ACTION deletes and migration refusals cannot be shown on SQLite.
  pg:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U test" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_DB: test
      DB_URL: postgresql://test:test@localhost:5432/test
      PG_TEST_URL: postgresql://test:test@localhost:5432/test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install . -r requirements-dev.txt
      - name: Migrate to head
        run: alembic upgrade head
      - name: Postgres tests
        run: pytest -v -m pg tests/pg
