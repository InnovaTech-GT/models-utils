<!DOCTYPE html>
<html lang="{% block lang %}es{% endblock %}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Uplink{% endblock %}</title>
</head>
<body style="margin:0; padding:0; background-color:#f4f4f5; font-family:Inter, Arial, 'Segoe UI', system-ui, sans-serif;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#f4f4f5;">
    <tr>
      <td align="center" style="padding:32px 12px;">
        <table role="presentation" width="520" cellpadding="0" cellspacing="0" style="width:100%; max-width:520px; background-color:#ffffff; border-radius:12px;">
          <tr>
            <td style="padding:32px;">
              <p style="margin:0 0 24px 0; font-size:18px; font-weight:700; color:#6366F1;">Uplink</p>
              {% block content %}{% endblock %}
              <hr style="border:none; border-top:1px solid #e5e7eb; margin:28px 0 16px 0;">
              <p style="margin:0; font-size:12px; line-height:1.5; color:#9ca3af;">{% block footer %}{% endblock %}</p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
